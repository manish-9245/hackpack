name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          version: "0.4.x"
      - run: uv sync
      - run: uv run pytest
      - name: Wrangler deploy dry-run
        run: uv run pywrangler deploy --dry-run
